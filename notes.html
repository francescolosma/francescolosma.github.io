<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes | Francesco Losma</title>
    <meta name="description" content="Notes and teaching material by Francesco Losma.">
    <meta name="author" content="Francesco Losma">
    <link rel="canonical" href="https://francescolosma.github.io/notes.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="notes">
    <!-- The banner and the sidebar are filled in by site.js -->
    <header class="site-header" id="site-header"></header>

    <main class="page-shell">
      <aside class="profile" id="profile" aria-label="Profile"></aside>

      <section class="content">
        <section class="section" id="notes">
          <h2>Notes</h2>

          <!-- One <article> per set of notes; put the PDFs in the files/ folder -->
          <article class="paper compact">
            <div class="paper-head">
              <h3><span class="todo">Title of Your Notes</span></h3>
              <div class="paper-actions">
                <a href="files/notes-one.pdf" target="_blank" rel="noreferrer">PDF</a>
              </div>
            </div>
            <p class="status"><span class="todo">Course or topic, year</span></p>
          </article>

          <article class="paper compact">
            <div class="paper-head">
              <h3><span class="todo">Title of Another Set of Notes</span></h3>
              <div class="paper-actions">
                <a href="files/notes-two.pdf" target="_blank" rel="noreferrer">PDF</a>
              </div>
            </div>
            <p class="status"><span class="todo">Course or topic, year</span></p>
          </article>
        </section>
      </section>
    </main>

    <script src="site.js"></script>
  </body>
</html>
